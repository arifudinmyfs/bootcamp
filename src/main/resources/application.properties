spring.application.name=bootcamp

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#port custom
server.port=3000

# Spring Security
spring.security.user.name=user
spring.security.user.password=12345

#ORACLE
spring.datasource.url=jdbc:oracle:thin:@146.190.149.240:1521:XE
spring.datasource.username=backoffice
spring.datasource.password=bni1234/
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway
spring.flyway.baseline-version=0
spring.flyway.user=backoffice
spring.flyway.password=bni1234/
spring.flyway.schemas=BACKOFFICE
spring.flyway.table=flyway_schema_histories_arif
spring.flyway.url=jdbc:oracle:thin:@146.190.149.240:1521:XE
spring.flyway.baseline-on-migrate=true

#KAFKA
# Konfigurasi Kafka Broker
spring.kafka.bootstrap-servers=localhost:9092
#spring.kafka.bootstrap-servers=146.190.149.240.9092

## List topik Kafka (bisa lebih dari satu, dipisahkan dengan koma)
kafka.topics=belajarkfk

# Group ID untuk Kafka Consumer
spring.kafka.consumer.group-id=belajarkafka

# Auto offset reset (latest, earliest, none)
spring.kafka.consumer.auto-offset-reset=earliest

